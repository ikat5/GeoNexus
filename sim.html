<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Explore · GeoNexus</title>
  <meta name="description" content="GeoNexus mission console: pick a site on Mars or the Moon, meet its terrain twin on Earth from the TerraTwin model, and drive a rover at both.">
  <meta name="theme-color" content="#07090C">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/cesium@1.140.0/Build/Cesium/Cesium.js">
  <link rel="expect" href="#boot" blocking="render">
  <style>
    /* first paint, before the bundle: the planet the landing hero morphs into (view-transition-name matches the hero) */
    html, body { margin: 0; background: #07090C; }
    #boot { position: fixed; left: 50%; top: 52%; width: min(56vh, 46vw); aspect-ratio: 1; translate: -50% -50%; border-radius: 50%;
      background: radial-gradient(circle at 36% 34%, #C4552B, #6E2412 58%, #1B0A06 100%); box-shadow: 0 0 60px rgba(255, 122, 69, .18);
      view-transition-name: target-globe; }
  </style>
</head>
<body>
  <div id="root"><div id="boot" aria-hidden="true"></div></div>
  <script type="module" src="/src/sim/main.tsx"></script>
</body>
</html>
